version: '3.8'

# ========================================================
# APEX PREDICT: 3-Tier Architecture Local Simulation
# Demonstrates VPC Subnet Isolation & Chained Security Groups
# ========================================================

services:
  # ------------------------------------------------------
  # Tier 1: Web Tier (Public Subnet Simulation)
  # ------------------------------------------------------
  web-tier:
    image: nginx:alpine
    container_name: apex-web-tier
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web_net # เชื่อมต่อเฉพาะ web_net (ไม่สามารถคุยกับ db_net ได้โดยเด็ดขาด)
    depends_on:
      - app-tier

  # ------------------------------------------------------
  # Tier 2: App Tier (Private Subnet Simulation)
  # ------------------------------------------------------
  app-tier:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-app-tier
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=super_secure_aws_term_project_secret_key_2026
      - DB_HOST=db-tier
      - DB_PORT=5432
      - DB_NAME=apex_predict_db
      - DB_USER=apex_admin
      - DB_PASSWORD=SecurePassword2026!
    networks:
      - web_net # รับคำขอจาก web-tier
      - db_net  # ส่งคำขอต่อไปยัง db-tier
    depends_on:
      - db-tier

  # ------------------------------------------------------
  # Tier 3: DB Tier (Isolated Subnet Simulation)
  # ------------------------------------------------------
  db-tier:
    image: postgres:15-alpine
    container_name: apex-db-tier
    restart: unless-stopped
    environment:
      - POSTGRES_DB=apex_predict_db
      - POSTGRES_USER=apex_admin
      - POSTGRES_PASSWORD=SecurePassword2026!
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net # เชื่อมต่อเฉพาะ db_net (ตัดขาดจาก web_net และ Internet 100%)

# ========================================================
# Network Segmentation (เสมือน Subnet Isolation บน AWS)
# ========================================================
networks:
  web_net:
    driver: bridge
    # เสมือนการเชื่อมต่อระหว่าง Public Subnet และ Private App Subnet (sg-web -> sg-app)
  db_net:
    driver: bridge
    internal: true 
    # internal: true ป้องกันไม่ให้ container ในเน็ตเวิร์กนี้ออกสู่อินเทอร์เน็ต เสมือน Isolated DB Subnet

volumes:
  pgdata:
